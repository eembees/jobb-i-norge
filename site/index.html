<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>norjobs — Norwegian Labour Market Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #a78bfa;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    flex: 1;
  }

  .control-hidden {
    display: none;
  }

  label {
    font-size: 0.75rem;
    color: #94a3b8;
    white-space: nowrap;
  }

  select, input[type="text"] {
    background: #252836;
    border: 1px solid #3d4166;
    color: #e2e8f0;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: #a78bfa;
  }

  input[type="text"] {
    width: 160px;
  }

  input[type="text"]::placeholder {
    color: #64748b;
  }

  #treemap-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  #treemap-svg {
    width: 100%;
    height: 100%;
  }

  .tile rect {
    stroke: #0f1117;
    stroke-width: 1px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .tile rect.dimmed {
    opacity: 0.15;
  }

  .tile rect.selected {
    stroke: #fff;
    stroke-width: 2px;
  }

  .tile text {
    pointer-events: none;
    dominant-baseline: hanging;
    user-select: none;
  }

  .tile .label-name {
    font-size: 11px;
    fill: rgba(255,255,255,0.9);
    font-weight: 600;
  }

  .tile .label-code {
    font-size: 9px;
    fill: rgba(255,255,255,0.55);
  }

  .group-label {
    font-size: 13px;
    font-weight: 700;
    fill: rgba(255,255,255,0.35);
    dominant-baseline: hanging;
    user-select: none;
    cursor: pointer;
  }

  #detail-panel {
    background: #1a1d27;
    border-top: 1px solid #2d3148;
    padding: 12px 16px;
    font-size: 0.82rem;
    display: none;
    flex-shrink: 0;
  }

  #detail-panel.visible {
    display: block;
  }

  #detail-panel h2 {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #f1f5f9;
  }

  .detail-grid {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .detail-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .detail-label {
    font-size: 0.7rem;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .detail-value {
    color: #e2e8f0;
    font-weight: 500;
  }

  #legend {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: #94a3b8;
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-bar {
    width: 80px;
    height: 8px;
    border-radius: 2px;
  }

  .legend-note {
    font-size: 0.7rem;
    color: #64748b;
  }

  #close-detail {
    float: right;
    cursor: pointer;
    color: #64748b;
    font-size: 1.2rem;
    line-height: 1;
    margin-left: 8px;
  }

  #close-detail:hover { color: #e2e8f0; }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 1rem;
    background: #0f1117;
  }

  #error-msg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #f87171;
    font-size: 0.9rem;
    text-align: center;
    padding: 32px;
    background: #0f1117;
  }

  #hover-card {
    position: absolute;
    display: none;
    min-width: 220px;
    max-width: 320px;
    padding: 10px 12px;
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 10px;
    background: rgba(15,17,23,0.96);
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    pointer-events: none;
    z-index: 5;
  }

  #hover-card.visible {
    display: block;
  }

  .hover-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .hover-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-size: 0.76rem;
  }

  .hover-label {
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .hover-value {
    color: #e2e8f0;
    text-align: right;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>norjobs</h1>
  <div class="controls">
    <label>Color by
      <select id="color-select">
        <option value="wage">Median wage</option>
        <option value="female">Female share</option>
        <option value="public">Public sector</option>
        <option value="edu">Education</option>
        <option value="ai" id="ai-option" disabled>AI score</option>
      </select>
    </label>
    <label>Group by
      <select id="group-select">
        <option value="major">Major group</option>
        <option value="ranked">Ranked</option>
        <option value="none">No grouping</option>
      </select>
    </label>
    <label id="rank-select-wrap" class="control-hidden">Rank by
      <select id="rank-select">
        <option value="female">Female share</option>
        <option value="public">Public sector</option>
        <option value="edu">Education</option>
      </select>
    </label>
    <input type="text" id="search" placeholder="Search occupation...">
  </div>
  <div id="legend"></div>
</header>

<div id="treemap-container">
  <div id="loading">Loading data...</div>
  <div id="error-msg"></div>
  <div id="hover-card"></div>
  <svg id="treemap-svg"></svg>
</div>

<div id="detail-panel">
  <span id="close-detail" title="Close">&#215;</span>
  <h2 id="dp-name"></h2>
  <div class="detail-grid">
    <div class="detail-item"><span class="detail-label">STYRK code</span><span class="detail-value" id="dp-code"></span></div>
    <div class="detail-item"><span class="detail-label">Major group</span><span class="detail-value" id="dp-group"></span></div>
    <div class="detail-item"><span class="detail-label">Employed</span><span class="detail-value" id="dp-employed"></span></div>
    <div class="detail-item"><span class="detail-label">Median wage</span><span class="detail-value" id="dp-wage"></span></div>
    <div class="detail-item"><span class="detail-label">Female share</span><span class="detail-value" id="dp-female"></span></div>
    <div class="detail-item"><span class="detail-label">Public sector</span><span class="detail-value" id="dp-public"></span></div>
    <div class="detail-item"><span class="detail-label">Education (most common)</span><span class="detail-value" id="dp-edu"></span></div>
    <div class="detail-item" id="dp-ai-item" style="display:none">
      <span class="detail-label">AI score</span><span class="detail-value" id="dp-ai"></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // -------------------------------------------------------------------------
  // Color scales
  // -------------------------------------------------------------------------

  const EDU_COLORS = {
    "no_formal": "#64748b",
    "primary": "#94a3b8",
    "lower_secondary": "#60a5fa",
    "upper_secondary": "#34d399",
    "post_secondary": "#a78bfa",
    "bachelor": "#f472b6",
    "master": "#fb923c",
    "doctoral": "#facc15",
    "unspecified": "#475569",
  };

  const EDU_LABELS = {
    "no_formal": "No formal",
    "primary": "Primary",
    "lower_secondary": "Lower sec.",
    "upper_secondary": "Upper sec.",
    "post_secondary": "Post-sec.",
    "bachelor": "Bachelor",
    "master": "Master",
    "doctoral": "Doctoral",
    "unspecified": "Unspecified",
  };

  function buildColorScales(data) {
    const wages = data.map(d => d.median_monthly_wage).filter(v => v != null);
    const wageScale = d3.scaleSequential()
      .domain([d3.min(wages), d3.max(wages)])
      .interpolator(d3.interpolateBlues)
      .unknown("#334155");

    const femaleScale = d3.scaleDiverging()
      .domain([0, 0.5, 1])
      .interpolator(d3.interpolateRgbBasis(["#2563eb", "#f8fafc", "#dc2626"]))
      .unknown("#334155");

    const publicScale = d3.scaleDiverging()
      .domain([0, 0.5, 1])
      .interpolator(d3.interpolateRgbBasis(["#2563eb", "#f8fafc", "#16a34a"]))
      .unknown("#334155");

    const aiScores = data.map(d => d.ai_score).filter(v => v != null);
    const aiScale = aiScores.length
      ? d3.scaleDiverging()
          .domain([0, 5, 10])
          .interpolator(d3.interpolateRdYlGn)
          .unknown("#334155")
      : null;

    return { wageScale, femaleScale, publicScale, aiScale };
  }

  function getColor(d, colorMode, scales) {
    switch (colorMode) {
      case "wage":   return scales.wageScale(d.median_monthly_wage);
      case "female": return scales.femaleScale(d.pct_female);
      case "public": return scales.publicScale(d.pct_public_sector);
      case "edu":    return EDU_COLORS[d.edu_level_mode] || "#334155";
      case "ai":     return scales.aiScale ? scales.aiScale(d.ai_score) : "#334155";
      default:       return "#334155";
    }
  }

  // -------------------------------------------------------------------------
  // Legend
  // -------------------------------------------------------------------------

  function renderLegend(colorMode, scales, hasAI) {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";

    function bar(interpolator, label0, label1) {
      const canvas = document.createElement("canvas");
      canvas.width = 80; canvas.height = 8;
      const ctx = canvas.getContext("2d");
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = d3.color(interpolator(i / 79)) || "#000";
        ctx.fillRect(i, 0, 1, 8);
      }
      const wrap = document.createElement("div");
      wrap.className = "legend-item";
      const start = document.createElement("span");
      start.style.fontSize = "0.65rem";
      start.style.color = "#64748b";
      start.textContent = label0;
      const end = document.createElement("span");
      end.style.fontSize = "0.65rem";
      end.style.color = "#64748b";
      end.textContent = label1;
      canvas.className = "legend-bar";
      wrap.appendChild(start);
      wrap.appendChild(canvas);
      wrap.appendChild(end);
      legend.appendChild(wrap);
    }

    if (colorMode === "wage") {
      const [lo, hi] = scales.wageScale.domain();
      bar(d3.interpolateBlues, `${Math.round(lo/1000)}k`, `${Math.round(hi/1000)}k NOK`);
    } else if (colorMode === "female") {
      bar(d3.interpolateRgbBasis(["#2563eb", "#f8fafc", "#dc2626"]), "100% male", "100% female");
    } else if (colorMode === "public") {
      if (scales.hasPublicData) {
        bar(d3.interpolateRgbBasis(["#2563eb", "#f8fafc", "#16a34a"]), "100% private", "100% public");
      } else {
        const note = document.createElement("div");
        note.className = "legend-note";
        note.textContent = "Public-sector data unavailable in this dataset";
        legend.appendChild(note);
      }
    } else if (colorMode === "ai" && hasAI) {
      bar(d3.interpolateRdYlGn, "0 (auto)", "10 (safe)");
    } else if (colorMode === "edu") {
      Object.entries(EDU_LABELS).forEach(([key, label]) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="legend-swatch" style="background:${EDU_COLORS[key]}"></span>${label}`;
        legend.appendChild(item);
      });
    }
  }

  // -------------------------------------------------------------------------
  // Treemap
  // -------------------------------------------------------------------------

  let selectedCode = null;
  let searchQuery = "";

  function formatPercent(value) {
    return value != null ? `${(value * 100).toFixed(1)}%` : "—";
  }

  function hoverRows(d) {
    return [
      ["STYRK", d.code],
      ["Employed", d.employed != null ? d.employed.toLocaleString("no-NO") : "—"],
      ["Median wage", d.median_monthly_wage != null ? `${d.median_monthly_wage.toLocaleString("no-NO")} kr/mnd` : "—"],
      ["Female share", formatPercent(d.pct_female)],
      ["Public sector", formatPercent(d.pct_public_sector)],
      ["Education", d.edu_level_mode ? (EDU_LABELS[d.edu_level_mode] || d.edu_level_mode) : "—"],
    ];
  }

  function weightedAverage(items, valueKey) {
    let weighted = 0;
    let total = 0;
    items.forEach(item => {
      const value = item[valueKey];
      const employed = item.employed || 0;
      if (value != null && employed > 0) {
        weighted += value * employed;
        total += employed;
      }
    });
    return total > 0 ? weighted / total : null;
  }

  function modeEducation(items) {
    const totals = new Map();
    items.forEach(item => {
      const key = item.edu_level_mode || "unspecified";
      totals.set(key, (totals.get(key) || 0) + (item.employed || 0));
    });
    let bestKey = null;
    let bestValue = -1;
    totals.forEach((value, key) => {
      if (value > bestValue) {
        bestKey = key;
        bestValue = value;
      }
    });
    return bestKey;
  }

  function groupHoverRows(group) {
    const children = group.children || [];
    const employedTotal = d3.sum(children, item => item.employed || 0);
    const wage = weightedAverage(children, "median_monthly_wage");
    const female = weightedAverage(children, "pct_female");
    const publicSector = weightedAverage(children, "pct_public_sector");
    const eduMode = modeEducation(children);
    return [
      ["Group", `${group.name} · ${group.major_group_name}`],
      ["Occupations", children.length.toLocaleString("no-NO")],
      ["Employed", employedTotal.toLocaleString("no-NO")],
      ["Median wage", wage != null ? `${Math.round(wage).toLocaleString("no-NO")} kr/mnd` : "—"],
      ["Female share", formatPercent(female)],
      ["Public sector", formatPercent(publicSector)],
      ["Education", eduMode ? (EDU_LABELS[eduMode] || eduMode) : "—"],
    ];
  }

  function showHoverCard(event, d) {
    const card = document.getElementById("hover-card");
    const container = document.getElementById("treemap-container");
    const name = d.name + (d.name_no && d.name_no !== d.name ? ` / ${d.name_no}` : "");
    const rows = hoverRows(d).map(([label, value]) =>
      `<span class="hover-label">${label}</span><span class="hover-value">${value}</span>`
    ).join("");
    card.innerHTML = `<div class="hover-title">${name}</div><div class="hover-meta">${rows}</div>`;
    const rect = container.getBoundingClientRect();
    const x = event.clientX - rect.left + 14;
    const y = event.clientY - rect.top + 14;
    card.classList.add("visible");
    const cardWidth = card.offsetWidth;
    const cardHeight = card.offsetHeight;
    const maxX = rect.width - cardWidth - 8;
    const maxY = rect.height - cardHeight - 8;
    card.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
    card.style.top = `${Math.max(8, Math.min(y, maxY))}px`;
  }

  function hideHoverCard() {
    document.getElementById("hover-card").classList.remove("visible");
  }

  function showGroupHoverCard(event, group) {
    const card = document.getElementById("hover-card");
    const container = document.getElementById("treemap-container");
    const rows = groupHoverRows(group).map(([label, value]) =>
      `<span class="hover-label">${label}</span><span class="hover-value">${value}</span>`
    ).join("");
    card.innerHTML = `<div class="hover-title">${group.major_group_name}</div><div class="hover-meta">${rows}</div>`;
    const rect = container.getBoundingClientRect();
    const x = event.clientX - rect.left + 14;
    const y = event.clientY - rect.top + 14;
    card.classList.add("visible");
    const cardWidth = card.offsetWidth;
    const cardHeight = card.offsetHeight;
    const maxX = rect.width - cardWidth - 8;
    const maxY = rect.height - cardHeight - 8;
    card.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
    card.style.top = `${Math.max(8, Math.min(y, maxY))}px`;
  }

  function buildHierarchy(data, groupMode) {
    if (groupMode === "none") {
      return { name: "root", children: data };
    }
    if (groupMode === "ranked") {
      return { name: "root", children: data };
    }
    // Group by major_group
    const groups = d3.group(data, d => d.major_group);
    return {
      name: "root",
      children: Array.from(groups, ([mg, children]) => ({
        name: String(mg),
        major_group_name: children[0]?.major_group_name || `Group ${mg}`,
        employed_total: d3.sum(children, c => c.employed || 0),
        children,
      })),
    };
  }

  function getRankValue(d, rankMode) {
    if (rankMode === "female") return d.pct_female;
    if (rankMode === "public") return d.pct_public_sector;
    if (rankMode === "edu") {
      const order = {
        no_formal: 0,
        primary: 1,
        lower_secondary: 2,
        upper_secondary: 3,
        post_secondary: 4,
        bachelor: 5,
        master: 6,
        doctoral: 7,
        unspecified: 8,
      };
      return d.edu_level_mode != null ? order[d.edu_level_mode] ?? 8 : null;
    }
    return null;
  }

  function buildRankedLeaves(data, W, H, rankMode) {
    const columnCount = rankMode === "edu" ? 9 : 12;
    const innerPad = 1;
    const columnGap = 2;
    const topInset = 18;
    const usableHeight = Math.max(0, H - topInset);
    const totalArea = Math.max(0, W * usableHeight);
    const totalEmployed = d3.sum(data, d => d.employed || 0) || 1;
    const columnWidth = Math.max(8, (W - columnGap * (columnCount - 1)) / columnCount);

    const buckets = Array.from({ length: columnCount }, () => []);
    for (const d of data) {
      const value = getRankValue(d, rankMode);
      let bucketIndex;
      if (value == null || Number.isNaN(value)) {
        bucketIndex = columnCount - 1;
      } else if (rankMode === "edu") {
        bucketIndex = Math.max(0, Math.min(columnCount - 1, Math.round(value)));
      } else {
        bucketIndex = Math.max(0, Math.min(columnCount - 1, Math.floor(value * columnCount)));
      }
      buckets[bucketIndex].push(d);
    }

    const leaves = [];
    buckets.forEach((bucket, bucketIndex) => {
      const x0 = bucketIndex * (columnWidth + columnGap);
      const x1 = bucketIndex === columnCount - 1 ? W : Math.min(W, x0 + columnWidth);
      let yCursor = H;
      bucket
        .slice()
        .sort((a, b) => (b.employed || 0) - (a.employed || 0))
        .forEach(d => {
          const area = ((d.employed || 0) / totalEmployed) * totalArea;
          const height = Math.max(3, area / Math.max(1, x1 - x0));
          const y1 = yCursor;
          const y0 = Math.max(topInset, y1 - height);
          if (y0 < H && y1 > topInset) {
            leaves.push({
              data: d,
              x0,
              x1,
              y0: Math.max(topInset, y0),
              y1: Math.min(H, y1 - innerPad),
            });
          }
          yCursor = y0 - innerPad;
        });
    });

    return leaves.filter(d => d.x1 > d.x0 && d.y1 > d.y0);
  }

  function rankedGuide(rankMode) {
    if (rankMode === "female") {
      return ["More male", "More female"];
    }
    if (rankMode === "public") {
      return ["More private", "More public"];
    }
    return ["Lower education", "Higher education"];
  }

  function drawTiles(svg, leaves, colorMode, scales) {
    const tile = svg.selectAll(".tile")
      .data(leaves, d => d.data.code)
      .join("g")
      .attr("class", "tile")
      .attr("transform", d => `translate(${d.x0},${d.y0})`);

    const w = d => d.x1 - d.x0;
    const h = d => d.y1 - d.y0;

    const matchSearch = d => {
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return (
        (d.data.name || "").toLowerCase().includes(q) ||
        (d.data.name_no || "").toLowerCase().includes(q) ||
        (d.data.code || "").includes(q)
      );
    };

    tile.append("rect")
      .attr("width", d => Math.max(0, w(d)))
      .attr("height", d => Math.max(0, h(d)))
      .attr("fill", d => getColor(d.data, colorMode, scales))
      .classed("dimmed", d => !matchSearch(d))
      .classed("selected", d => d.data.code === selectedCode)
      .on("mouseenter", (event, d) => showHoverCard(event, d.data))
      .on("mousemove", (event, d) => showHoverCard(event, d.data))
      .on("mouseleave", hideHoverCard)
      .on("click", (event, d) => {
        selectedCode = d.data.code;
        showDetail(d.data);
        svg.selectAll(".tile rect")
          .classed("selected", nd => nd.data.code === selectedCode);
      });

    tile.each(function(d) {
      const tw = w(d), th = h(d);
      const area = tw * th;
      if (area < 1500) return;
      const g = d3.select(this);
      if (tw > 30 && th > 16) {
        g.append("text")
          .attr("class", "label-name")
          .attr("x", 3).attr("y", 3)
          .attr("width", tw - 6)
          .text(truncate(d.data.name, tw, 11));
      }
      if (tw > 40 && th > 30) {
        g.append("text")
          .attr("class", "label-code")
          .attr("x", 3).attr("y", 16)
          .text(d.data.code);
      }
    });
  }

  function render(data, colorMode, groupMode, rankMode, scales) {
    const container = document.getElementById("treemap-container");
    const svg = d3.select("#treemap-svg");
    svg.selectAll("*").remove();

    const W = container.clientWidth;
    const H = container.clientHeight;
    svg.attr("width", W).attr("height", H);

    if (groupMode === "ranked") {
      const [leftLabel, rightLabel] = rankedGuide(rankMode);
      svg.append("text")
        .attr("class", "group-label")
        .attr("x", 4)
        .attr("y", 3)
        .text(`${leftLabel} → ${rightLabel}`);
      const leaves = buildRankedLeaves(data, W, H, rankMode);
      drawTiles(svg, leaves, colorMode, scales);
      return;
    }

    const root = d3.hierarchy(buildHierarchy(data, groupMode))
      .sum(d => d.employed || 0)
      .sort((a, b) => b.value - a.value);

    d3.treemap()
      .size([W, H])
      .tile(d3.treemapSquarify)
      .paddingOuter(groupMode === "none" ? 1 : 3)
      .paddingTop(groupMode === "none" ? 0 : 18)
      .paddingInner(1)
      (root);

    const leaves = root.leaves();

    // Group borders
    if (groupMode !== "none") {
      svg.selectAll(".group-border")
        .data(root.children || [])
        .join("g")
        .attr("class", "group-border")
        .each(function(d) {
          const g = d3.select(this);
          const groupWidth = d.x1 - d.x0;
          const clipId = `group-clip-${String(d.data.name).replace(/[^a-zA-Z0-9_-]/g, "")}-${Math.round(d.x0)}-${Math.round(d.y0)}`;
          const label = `${d.data.name} · ${d.data.major_group_name} · ${d.data.employed_total.toLocaleString("no-NO")}`;

          g.append("clipPath")
            .attr("id", clipId)
            .append("rect")
            .attr("x", d.x0 + 2)
            .attr("y", d.y0 + 1)
            .attr("width", Math.max(0, groupWidth - 4))
            .attr("height", 16);

          g.append("rect")
            .attr("x", d.x0).attr("y", d.y0)
            .attr("width", d.x1 - d.x0).attr("height", d.y1 - d.y0)
            .attr("fill", "none")
            .attr("stroke", "#3d4166")
            .attr("stroke-width", 1);
          g.append("text")
            .attr("class", "group-label")
            .attr("x", d.x0 + 4).attr("y", d.y0 + 3)
            .attr("clip-path", `url(#${clipId})`)
            .text(truncate(label, Math.max(0, groupWidth - 8), 13))
            .on("mouseenter", event => showGroupHoverCard(event, d.data))
            .on("mousemove", event => showGroupHoverCard(event, d.data))
            .on("mouseleave", hideHoverCard);
        });
    }

    drawTiles(svg, leaves, colorMode, scales);
  }

  function truncate(text, widthPx, fontSize) {
    if (!text) return "";
    // Approximate: ~0.55 * fontSize per character
    const maxChars = Math.floor(widthPx / (fontSize * 0.58));
    if (maxChars <= 1) return "";
    return text.length <= maxChars ? text : text.slice(0, maxChars - 1) + "…";
  }

  // -------------------------------------------------------------------------
  // Detail panel
  // -------------------------------------------------------------------------

  function fmt(v, suffix = "") {
    return v != null ? `${Number(v).toLocaleString("no-NO")}${suffix}` : "—";
  }

  function showDetail(d) {
    document.getElementById("dp-name").textContent = d.name + (d.name_no && d.name_no !== d.name ? ` / ${d.name_no}` : "");
    document.getElementById("dp-code").textContent = d.code;
    document.getElementById("dp-group").textContent = d.major_group != null ? `${d.major_group} — ${d.major_group_name || ""}` : "—";
    document.getElementById("dp-employed").textContent = d.employed != null ? d.employed.toLocaleString("no-NO") : "—";
    document.getElementById("dp-wage").textContent = d.median_monthly_wage != null ? `${d.median_monthly_wage.toLocaleString("no-NO")} kr/mnd` : "—";
    document.getElementById("dp-female").textContent = formatPercent(d.pct_female);
    document.getElementById("dp-public").textContent = formatPercent(d.pct_public_sector);
    document.getElementById("dp-edu").textContent = d.edu_level_mode ? (EDU_LABELS[d.edu_level_mode] || d.edu_level_mode) : "—";

    const aiItem = document.getElementById("dp-ai-item");
    if (d.ai_score != null) {
      aiItem.style.display = "";
      document.getElementById("dp-ai").textContent = `${d.ai_score.toFixed(1)} / 10${d.ai_rationale ? " — " + d.ai_rationale : ""}`;
    } else {
      aiItem.style.display = "none";
    }

    document.getElementById("detail-panel").classList.add("visible");
  }

  document.getElementById("close-detail").addEventListener("click", () => {
    document.getElementById("detail-panel").classList.remove("visible");
    selectedCode = null;
    document.querySelectorAll(".tile rect.selected").forEach(el => el.classList.remove("selected"));
  });

  // -------------------------------------------------------------------------
  // Main
  // -------------------------------------------------------------------------

  async function main() {
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error-msg");

    let data;
    try {
      const resp = await fetch("./data.json");
      if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
      data = await resp.json();
    } catch (err) {
      loadingEl.style.display = "none";
      errorEl.style.display = "flex";
      errorEl.textContent = `Failed to load data.json: ${err.message}\n\nMake sure you have run build_site_data.py and are serving from a web server (not file://).`;
      return;
    }

    loadingEl.style.display = "none";

    // Check if AI scores are present
    const hasAI = data.some(d => d.ai_score != null);
    if (hasAI) {
      document.getElementById("ai-option").disabled = false;
    }

    const scales = buildColorScales(data);
    scales.hasPublicData = data.some(d => d.pct_public_sector != null);

    let colorMode = "wage";
    let groupMode = "major";
    let rankMode = "female";

    function syncControlVisibility() {
      document.getElementById("rank-select-wrap")
        .classList.toggle("control-hidden", groupMode !== "ranked");
    }

    function fullRender() {
      syncControlVisibility();
      render(data, colorMode, groupMode, rankMode, scales);
      renderLegend(colorMode, scales, hasAI);
    }

    fullRender();

    document.getElementById("color-select").addEventListener("change", e => {
      colorMode = e.target.value;
      fullRender();
    });

    document.getElementById("group-select").addEventListener("change", e => {
      groupMode = e.target.value;
      fullRender();
    });

    document.getElementById("rank-select").addEventListener("change", e => {
      rankMode = e.target.value;
      if (groupMode === "ranked") {
        fullRender();
      }
    });

    document.getElementById("search").addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      // Only re-render tiles (no layout change needed)
      const scales2 = scales;
      const matchSearch = d => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (
          (d.data.name || "").toLowerCase().includes(q) ||
          (d.data.name_no || "").toLowerCase().includes(q) ||
          (d.data.code || "").includes(q)
        );
      };
      d3.selectAll(".tile rect")
        .classed("dimmed", d => !matchSearch(d));
    });

    window.addEventListener("resize", () => {
      fullRender();
    });
  }

  main();
})();
</script>
